<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Dashboard de Proyectos</h1>
    </header>
    <main>
        <section class="projects">
            <h2>Mis Proyectos</h2>
            <nav>
                <a href="#" class="btn">Proyecto "Alpha"</a>
                <a href="#" class="btn">Proyecto "Beta"</a>
                <a href="#" class="btn">Nuevo Proyecto</a>
            </nav>
        </section>
        <section class="learning-notes">
            <h2>Visual de Aprendizaje (Editable)</h2>
            <div class="editable-area" contenteditable="true">
                <p>Aquí puedes escribir tus notas, ideas o cualquier cosa que estés aprendiendo. ¡Haz clic para empezar a editar!</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Creado con ❤️ para organizar el aprendizaje.</p>
    </footer>
</body>
</html>
