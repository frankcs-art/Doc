<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Dashboard de Proyectos</h1>
        </header>
        <main>
            <section class="projects">
                <h2>Mis Proyectos</h2>
                <div class="project-buttons">
                    <button>Proyecto 1</button>
                    <button>Proyecto 2</button>
                    <button>Proyecto 3</button>
                </div>
            </section>
            <section class="learning">
                <h2>Mi Aprendizaje</h2>
                <div class="editable-visual" contenteditable="true">
                    <p>Aquí puedes escribir tus notas...</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
