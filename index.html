<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Mi Dashboard Personal</h1>
        </header>
        <main>
            <section class="projects">
                <h2>Mis Proyectos</h2>
                <div class="project-buttons">
                    <button class="btn">Proyecto Alpha</button>
                    <button class="btn">Proyecto Beta</button>
                    <button class="btn btn-secondary">Idea Secreta</button>
                    <button class="btn btn-special">Nuevo Proyecto +</button>
                </div>
            </section>
            <section class="learning">
                <h2>Notas de Aprendizaje</h2>
                <div class="editable-visual" contenteditable="true" role="textbox" aria-label="Notas de Aprendizaje Editables">
                    <p>Aquí puedes escribir tus notas...</p>
                    <ul>
                        <li>Hoy aprendí sobre HTML semántico.</li>
                        <li>Y también sobre la propiedad `contenteditable`.</li>
                    </ul>
                </div>
            </section>
        </main>
        <footer>
            <p>Hecho con ❤️ por Jules</p>
        </footer>
    </div>
</body>
</html>
