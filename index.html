<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>Mis Proyectos</h1>
            <nav>
                <button class="btn">Todos</button>
                <button class="btn btn-primary">Activos</button>
                <button class="btn">Completados</button>
            </nav>
        </header>
        <main class="dashboard-main">
            <div class="project-card">
                <h2>Proyecto Alpha</h2>
                <p>Desarrollo de la nueva landing page.</p>
                <div class="project-actions">
                    <button class="btn btn-secondary">Ver Tareas</button>
                    <button class="btn">Archivar</button>
                </div>
            </div>
            <div class="project-card">
                <h2>Proyecto Beta</h2>
                <p>Implementación de la API de pagos.</p>
                <div class="project-actions">
                    <button class="btn btn-secondary">Ver Tareas</button>
                    <button class="btn">Archivar</button>
                </div>
            </div>
            <div class="learning-zone">
                <h2>Zona de Aprendizaje</h2>
                <div class="editable-content" contenteditable="true">
                    <p>Haz clic aquí para escribir tus notas...</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
