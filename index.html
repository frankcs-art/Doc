<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Dashboard Personal</h1>
    </header>
    <main>
        <section class="projects">
            <h2>Mis Proyectos</h2>
            <div class="project-card">
                <h3>Proyecto "Alfa"</h3>
                <p>Desarrollo de una aplicación de gestión de tareas.</p>
                <button>Ver Detalles</button>
                <button>Ir al Repositorio</button>
            </div>
            <div class="project-card">
                <h3>Proyecto "Beta"</h3>
                <p>Creación de un sitio web de portafolio personal.</p>
                <button>Ver Detalles</button>
                <button>Ir al Repositorio</button>
            </div>
        </section>
        <section class="learning">
            <h2>Zona de Aprendizaje</h2>
            <div class="editable-content" contenteditable="true">
                <p>Aquí puedes escribir tus notas y objetivos de aprendizaje. ¡Haz clic para editar!</p>
            </div>
        </section>
    </main>
</body>
</html>
