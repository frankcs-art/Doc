<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Dashboard Personal</h1>
        </header>
        <main>
            <section class="projects">
                <h2>Mis Proyectos</h2>
                <div class="project-list">
                    <div class="project-item">
                        <span>Proyecto "Alfa"</span>
                        <button>Ver</button>
                    </div>
                    <div class="project-item">
                        <span>Proyecto "Beta"</span>
                        <button>Ver</button>
                    </div>
                    <div class="project-item">
                        <span>Proyecto "Gamma"</span>
                        <button>Ver</button>
                    </div>
                </div>
            </section>
            <section class="learning">
                <h2>Mi Aprendizaje</h2>
                <div class="editable-content" contenteditable="true">
                    <p>Aquí puedes escribir y editar tus notas de aprendizaje directamente en el navegador. Haz clic para empezar a escribir...</p>
                    <ul>
                        <li>CSS Flexbox</li>
                        <li>HTML Semántico</li>
                        <li>JavaScript Básico</li>
                    </ul>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
