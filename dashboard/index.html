<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Personal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Dashboard Personal</h1>
  </header>

  <main>
    <section class="proyectos">
      <h2>Proyectos</h2>
      <button class="btn">Proyecto A</button>
      <button class="btn">Proyecto B</button>
      <button class="btn">Proyecto C</button>
    </section>

    <section class="aprendizaje">
      <h2>Notas de Aprendizaje</h2>
      <div
        class="editable"
        contenteditable="true"
        role="textbox"
        aria-label="Área de notas de aprendizaje editable">
        Escribe aquí tus notas...
      </div>
    </section>
  </main>

</body>
</html>
