<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Proyectos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mi Dashboard de Proyectos</h1>
  </header>
  <main>
    <section class="proyectos">
      <h2>Mis Proyectos</h2>
      <div class="proyecto-botones">
        <button>Proyecto Alpha</button>
        <button>Proyecto Beta</button>
        <button>Nuevo Proyecto</button>
      </div>
    </section>
    <section class="aprendizaje">
      <h2>Mi Aprendizaje</h2>
      <div class="editable" contenteditable="true" role="textbox" aria-label="Sección de aprendizaje editable">
        <p>Aquí puedes escribir tus notas y reflexiones sobre tu aprendizaje. ¡Haz clic para empezar a editar!</p>
      </div>
    </section>
  </main>
</body>
</html>
