<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <h1>Mi Dashboard Personal</h1>
        <div class="projects">
            <h2>Mis Proyectos</h2>
            <button class="project-btn">Proyecto 1</button>
            <button class="project-btn">Proyecto 2</button>

            </div>
        </div>
    </div>

</html>
