<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Proyectos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Dashboard de Proyectos</h1>
  </header>

  <main class="container">
    <section class="projects">
      <h2>Mis Proyectos</h2>
      <ul class="projects-list">
        <li><a href="#" class="btn">Proyecto Alpha</a></li>
        <li><a href="#" class="btn">Proyecto Beta</a></li>
        <li><a href="#" class="btn">Proyecto Gamma</a></li>
      </ul>
    </section>

    <section class="learning">
      <h2>Mi Aprendizaje</h2>
      <div
        class="learning-box"
        contenteditable="true"
        role="textbox"
        aria-label="Área de aprendizaje editable. Escribe aquí tus notas."
        data-placeholder="Escribe aquí tus notas..."></div>
    </section>
  </main>

</body>
</html>
