<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Proyectos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Dashboard Personal</h1>
    </header>
    <main>
        <section class="projects">
            <h2>Mis Proyectos</h2>
            <div class="project-buttons">
                <button>Proyecto Alpha</button>
                <button>Proyecto Beta</button>
                <button>Proyecto Gamma</button>
                <button class="add-project">+</button>
            </div>
        </section>
        <section class="notes">
            <h2>Notas de Aprendizaje</h2>
            <div class="editable-notes" contenteditable="true" role="textbox" aria-label="Área de notas editables">
                <p>Aquí puedes escribir tus notas...</p>
            </div>
        </section>
    </main>
</body>
</html>
